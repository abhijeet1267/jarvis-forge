name: ci

# macOS, not Ubuntu: Vantage drives `say`, `pmset`, AppleScript and the macOS
# Vision framework, and its tests assert on those code paths. A Linux runner would
# be measuring a different product.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The native macOS app's unit tests (BackendManager state/polling lifecycle).
  # Runs on macos-latest because the test target needs the public XCTest module,
  # which is only present with a full Xcode install -- not Command Line Tools.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build the native app
        working-directory: macos/Vantage
        run: swift build

      - name: Run the Swift unit tests
        working-directory: macos/Vantage
        run: swift test

      - name: Verify the app binary was produced
        working-directory: macos/Vantage
        run: test -f .build/debug/Vantage && echo "app binary present"

  suite:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The voice tests' premise is "a capture backend is installed and macOS
      # consent varies". A bare runner has no ffmpeg, so the honest state there is
      # no_backend -- which is a different scenario, not a passing one. Install the
      # premise rather than skipping the check.
      - name: Install the capture backend the voice tests presuppose
        run: brew install ffmpeg

      # The dashboard browser tests drive a real Chromium. `pip install playwright`
      # installs the client, never the browser binary, so without this every
      # browser test failed with "Executable doesn't exist" -- an environment gap
      # reported as a code failure. Install the premise the tests assume.
      - name: Install the browser the dashboard tests drive
        run: python -m playwright install --with-deps chromium

      - name: Node availability (the dashboard's own JS is executed, not iminated)
        run: node --version

      # A set of tests pin the *live* backend's wire shape (they read
      # `$JARVIS_HOME/api_token` and GET /health). On a developer's machine the
      # server is already running; on a runner it never is, so those files failed
      # with FileNotFoundError and looked like code defects. Start the real
      # server and give it time to answer, rather than weakening the tests: the
      # point of those files is that they check what the server actually sends.
      - name: Start the backend the wire-contract tests pin
        run: |
          .venv/bin/python run.py > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8765/health" \
               -H "X-JARVIS-Token: $(cat "$HOME/.jarvis-forge/api_token" 2>/dev/null)"; then
              echo "backend is answering"; exit 0
            fi
            sleep 1
          done
          echo "backend did not answer in 60s"; tail -50 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Test suite
        env:
          JARVIS_LOG_LEVEL: WARNING
        run: python -m pytest -q

      - name: Stop the backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
          fi

      # The README's Downloads section tells people to build the app, so CI builds it.
      # Into a temp dir: dist/ is gitignored, and the point is that a clean checkout
      # can produce a signed, launchable bundle -- not that the artifact survives the job.
      - name: Build the desktop bundle
        if: matrix.python-version == '3.11'
        run: python build_app.py --dest "$(mktemp -d)"

      # The README's numbers are generated, not typed. This proves the generators
      # still run against the code they describe; the latency figures are allowed to
      # differ per machine, so the artifact contents are not diffed here.
      - name: Regenerate benchmarks and figures
        run: |
          python benchmarks/acceptance_run.py
          python benchmarks/safety_run.py
          python assets/build_charts.py
          python assets/build_diagrams.py
          python - <<'PY'
          import glob, xml.dom.minidom
          for path in sorted(glob.glob("assets/*.svg")):
              xml.dom.minidom.parse(path)
          print("all figures parse as valid XML")
          PY

      - name: Upload measured benchmark data
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-py311
          path: benchmarks/*.json
          if-no-files-found: error

  # The native companion (android/, com.vantage.companion). Its unit suite
  # includes the cross-language certificate-pinning contract, so it must run
  # whenever the gateway's certificate lifecycle changes.
  android:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-missing}"
          ls "${ANDROID_HOME:-/nonexistent}/build-tools" || echo "no build-tools"

      - name: Native unit tests (incl. pinning contract)
        # Uses the pinned Gradle wrapper (gradle/wrapper/gradle-wrapper.properties)
        # so the toolchain is reproducible -- a bare runner has no `gradle` on PATH.
        #
        # No `env: ANDROID_HOME: ${{ env.ANDROID_HOME }}` here. That expression
        # reads the *workflow* env context, which never defines ANDROID_HOME, so
        # it resolved to an empty string and overwrote the runner's own SDK
        # path. The package-identity step then looked in `/build-tools/...`
        # and failed with "No such file or directory" on a perfectly good APK.
        # The runner already exports ANDROID_HOME; inheriting it is the fix.
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build the native APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify APK package identity
        working-directory: android
        run: |
          # Resolve aapt2 from wherever this runner keeps the SDK: the
          # ANDROID_HOME env var, ANDROID_SDK_ROOT, or the default location on
          # a macOS image. Then take the newest build-tools that has it.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "SDK: $SDK"
          AAPT="$(ls -d "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "FAIL: aapt2 not found under $SDK/build-tools"
            ls "$SDK" 2>/dev/null || echo "(no SDK directory)"
            exit 1
          fi
          echo "aapt2: $AAPT"
          IDENTITY="$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep '^package:')"
          echo "$IDENTITY"
          echo "$IDENTITY" | grep -q "com.vantage.companion" \
            || { echo "FAIL: wrong package identity"; exit 1; }

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
