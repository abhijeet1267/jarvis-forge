[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-forge"
version = "0.1.0"
description = "A permissioned, multi-agent personal AI operating system (core)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-api = "jarvis.api.app:run"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# "slow" marks tests that reach the network and are skipped when offline.
markers = ["slow: marks tests that require network access (deselect with -m 'not slow')"]
