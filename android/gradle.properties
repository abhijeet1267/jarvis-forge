org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# JDK version guard: AGP 8.7 + Gradle 8.11 match JDK 17–21. JDK 22+ breaks the
# instrumentation transform (SecurityManager removed, module-system changes).
# Set JAVA_HOME to a compatible JDK before running any Gradle command.
org.gradle.parallel=true
org.gradle.caching=true
# Disable parallel test workers: Android unit tests share a process, and
# concurrent execution can mask race conditions in coroutine test dispatchers.
# Bounded, sequential execution has been stable across repeated runs.
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
