 <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0v26" fill="none" stroke="#e2e7ef" stroke-width="1"/></pattern>
 <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6df6" stop-opacity=".16"/><stop offset="1" stop-color="#2f6df6" stop-opacity="0"/></linearGradient>
</defs>
<rect width="100%" height="100%" fill="#f5f7fa"/><rect width="100%" height="100%" fill="url(#g)" opacity=".6"/>
<rect x="1" y="1" width="1178" height="698" rx="16" fill="#ffffff" stroke="#e2e7ef"/>
<text x="40" y="52" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2.6" fill="#1b2230">WHERE EACH STATE COMES FROM</text>
<text x="40" y="74" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6b7688">the mapping the dashboard applies to server fields -- and the fields it is forbidden to invent</text>
<text x="46" y="98" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6b7688">STATE</text><text x="300" y="98" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6b7688">DERIVED FROM (response field)</text><text x="742" y="98" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6b7688">WHAT IT MEANS TO THE PERSON READING IT</text><rect x="40" y="100" width="1100" height="36" rx="6" fill="#f5f7fa" opacity=".7"/><rect x="46" y="104" width="83.36" height="26" rx="13" fill="#16a34a" opacity=".12"/><rect x="46" y="104" width="83.36" height="26" rx="13" fill="none" stroke="#16a34a" stroke-width="1.1"/><text x="87.68" y="121" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#16a34a">VERIFIED</text><text x="300" y="121" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">actions[].verification == "success"</text><text x="742" y="121" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">an effect was observed in the world</text><rect x="46" y="146" width="146.72" height="26" rx="13" fill="#0d9488" opacity=".12"/><rect x="46" y="146" width="146.72" height="26" rx="13" fill="none" stroke="#0d9488" stroke-width="1.1"/><text x="119.36" y="163" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#0d9488">VERIFIED IN PART</text><text x="300" y="163" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">all steps success AND plan.unhandled non-empty</text><text x="742" y="163" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">the request was answered in part</text><rect x="40" y="184" width="1100" height="36" rx="6" fill="#f5f7fa" opacity=".7"/><rect x="46" y="188" width="91.28" height="26" rx="13" fill="#d97706" opacity=".12"/><rect x="46" y="188" width="91.28" height="26" rx="13" fill="none" stroke="#d97706" stroke-width="1.1"/><text x="91.64" y="205" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#d97706">SIMULATED</text><text x="300" y="205" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">actions[].output.simulated == true</text><text x="742" y="205" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">a simulator accepted it; nothing real moved</text><rect x="46" y="230" width="107.12" height="26" rx="13" fill="#d97706" opacity=".12"/><rect x="46" y="230" width="107.12" height="26" rx="13" fill="none" stroke="#d97706" stroke-width="1.1"/><text x="99.56" y="247" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#d97706">UNAVAILABLE</text><text x="300" y="247" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">verification failed + provider_status unavailable/network_error</text><text x="742" y="247" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">the source could not be reached</text><rect x="40" y="268" width="1100" height="36" rx="6" fill="#f5f7fa" opacity=".7"/><rect x="46" y="272" width="186.32" height="26" rx="13" fill="#d97706" opacity=".12"/><rect x="46" y="272" width="186.32" height="26" rx="13" fill="none" stroke="#d97706" stroke-width="1.1"/><text x="139.16" y="289" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#d97706">AWAITING CONFIRMATION</text><text x="300" y="289" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">needs_confirmation + confirmation_id</text><text x="742" y="289" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">parked; nothing has run</text><rect x="46" y="314" width="146.72" height="26" rx="13" fill="#0f172a" opacity=".12"/><rect x="46" y="314" width="146.72" height="26" rx="13" fill="none" stroke="#0f172a" stroke-width="1.1"/><text x="119.36" y="331" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#0f172a">NOTHING EXECUTED</text><text x="300" y="331" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">plan.reply_kind == declined</text><text x="742" y="331" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">JARVIS said no, and said why</text><rect x="40" y="352" width="1100" height="36" rx="6" fill="#f5f7fa" opacity=".7"/><rect x="46" y="356" width="130.88" height="26" rx="13" fill="#6b7688" opacity=".12"/><rect x="46" y="356" width="130.88" height="26" rx="13" fill="none" stroke="#6b7688" stroke-width="1.1"/><text x="111.44" y="373" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#6b7688">NOT RECOGNISED</text><text x="300" y="373" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">plan.reply_kind == not_understood</text><text x="742" y="373" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">no rule matched the goal</text><rect x="46" y="398" width="122.96" height="26" rx="13" fill="#6b7688" opacity=".12"/><rect x="46" y="398" width="122.96" height="26" rx="13" fill="none" stroke="#6b7688" stroke-width="1.1"/><text x="107.47999999999999" y="415" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#6b7688">NOT AVAILABLE</text><text x="300" y="415" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">plan.reply_kind == capability_missing</text><text x="742" y="415" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">no such tool exists yet</text><rect x="40" y="436" width="1100" height="36" rx="6" fill="#f5f7fa" opacity=".7"/><rect x="46" y="440" width="115.03999999999999" height="26" rx="13" fill="#d97706" opacity=".12"/><rect x="46" y="440" width="115.03999999999999" height="26" rx="13" fill="none" stroke="#d97706" stroke-width="1.1"/><text x="103.52" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#d97706">NEEDS DETAIL</text><text x="300" y="457" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">plan.needs_clarification == true</text><text x="742" y="457" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">a question back, not an answer</text><rect x="46" y="482" width="75.44" height="26" rx="13" fill="#dc2626" opacity=".12"/><rect x="46" y="482" width="75.44" height="26" rx="13" fill="none" stroke="#dc2626" stroke-width="1.1"/><text x="83.72" y="499" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#dc2626">BLOCKED</text><text x="300" y="499" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">decision == BLOCK / blocked_reason</text><text x="742" y="499" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">refused by policy or the safety guard</text><rect x="40" y="520" width="1100" height="36" rx="6" fill="#f5f7fa" opacity=".7"/><rect x="46" y="524" width="67.52" height="26" rx="13" fill="#dc2626" opacity=".12"/><rect x="46" y="524" width="67.52" height="26" rx="13" fill="none" stroke="#dc2626" stroke-width="1.1"/><text x="79.75999999999999" y="541" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#dc2626">FAILED</text><text x="300" y="541" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">verification == failed</text><text x="742" y="541" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">it was attempted and did not work</text><rect x="46" y="566" width="75.44" height="26" rx="13" fill="#dc2626" opacity=".12"/><rect x="46" y="566" width="75.44" height="26" rx="13" fill="none" stroke="#dc2626" stroke-width="1.1"/><text x="83.72" y="583" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#dc2626">UNKNOWN</text><text x="300" y="583" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#1b2230">no evidence above distinguishes it</text><text x="742" y="583" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">the honest answer when nothing else does</text><line x1="40" y1="624" x2="1140" y2="624" stroke="#e2e7ef"/><text x="46" y="650" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#dc2626">NEVER A PATH TO VERIFIED:</text><text x="288" y="650" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">HTTP 200 &#183; action.ok &#183; reply text containing "success" &#183; a client-supplied verified/status field</text><text x="46" y="672" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#6b7688">The dashboard renders server truth. It authorises nothing, and a forged field can change a label and nothing else.</text></svg>
